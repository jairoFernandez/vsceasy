on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install
      # Generates src/lib/templatesData.ts (gitignored build artifact) that the
      # CLI + tests import. Must run before `bun test`.
      - run: bun run embed:templates
      - run: bun test
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-slim
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install
      # Docs-only commits land on main without a version bump. Skip the publish
      # instead of failing the run on "cannot publish over previously published
      # versions".
      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@vsceasy/cli@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@vsceasy/cli@$VERSION is already published — skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "@vsceasy/cli@$VERSION is new — will publish."
          fi
      - name: Update version in cli.ts
        if: steps.check.outputs.published == 'false'
        run: |
          sed -i "s/version: '[^']*'/version: '${{ steps.check.outputs.version }}'/" src/cli.ts
      - run: bun run build
        if: steps.check.outputs.published == 'false'
      - run: npm publish --provenance --access public
        if: steps.check.outputs.published == 'false'
